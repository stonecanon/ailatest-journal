<script>
(function () {
  // �?js/app.js 保持一致：API �?OAuth 都使�?api.ailatest.org�?  const API_BASE = location.hostname === 'localhost' ? 'http://localhost:8787' : 'https://api.ailatest.org';
  const AUTH_BASE = API_BASE;

  const params   = new URLSearchParams(location.search);
  const fromExt  = params.get('ext') === '1';
  const redirect = params.get('redirect') || '/';

  const form   = document.getElementById('email-form');
  const btn    = document.getElementById('submit-btn');
  const msg    = document.getElementById('form-msg');
  const emailEl = document.getElementById('email');
  const codeEl  = document.getElementById('code');

  function showDone(user) {
    document.getElementById('auth-card').hidden = true;
    const done = document.getElementById('done-card');
    done.hidden = false;
    const who = user && (user.name || user.email || user.login) || '';
    if (fromExt) {
      document.getElementById('done-msg').textContent =
        `${who} 已登录。现在回到浏览器插件弹窗即可（插件会自动同步登录状态），本页可关闭。`;
    } else {
      document.getElementById('done-msg').textContent = `${who} 已登录，正在返回…`;
      setTimeout(() => { location.href = redirect; }, 1200);
    }
  }

  function finishLogin(token, user) {
    // �?SPA 共用同一份本地登录�?    localStorage.setItem('ailatest.user', JSON.stringify({ ...(user || {}), token }));
    showDone(user);
  }

  async function readJson(resp, fallback) {
    let d = null;
    try { d = await resp.json(); } catch (_) {}
    if (!resp.ok || (d && d.error)) throw new Error((d && d.error) || fallback);
    return d;
  }

  // OAuth 回跳�?token=xxx
  const tokenParam = params.get('token');
  if (tokenParam) {
    fetch(`${API_BASE}/me`, { headers: { Authorization: `Bearer ${tokenParam}` } })
      .then((r) => readJson(r, '登录信息获取失败'))
      .then((me) => finishLogin(tokenParam, me))
      .catch((e) => { msg.textContent = e.message; msg.className = 'form-msg err'; });
  }

  // 已登录则直接显示完成�?  try {
    const saved = JSON.parse(localStorage.getItem('ailatest.user') || 'null');
    if (!tokenParam && saved && saved.token) showDone(saved);
  } catch (_) {}

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const step = btn.dataset.step;
    const email = (form.dataset.email || emailEl.value).trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      msg.textContent = '请输入有效邮�?; msg.className = 'form-msg err'; return;
    }
    btn.disabled = true; msg.textContent = ''; msg.className = 'form-msg';
    try {
      if (step === 'request') {
        const r = await fetch(`${API_BASE}/auth/email/request`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        await readJson(r, '发送验证码失败');
        form.dataset.email = email;
        emailEl.readOnly = true;
        document.getElementById('code-row').hidden = false;
        codeEl.required = true; codeEl.focus();
        btn.dataset.step = 'verify'; btn.textContent = '登录 / 注册';
        msg.textContent = '验证码已发送，10 分钟内有�?; msg.className = 'form-msg ok';
      } else {
        const r = await fetch(`${API_BASE}/auth/email/verify`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, code: codeEl.value.trim() }),
        });
        const d = await readJson(r, '验证码验证失�?);
        if (!d.token) throw new Error('验证失败：未收到登录凭证');
        finishLogin(d.token, d.user);
      }
    } catch (err) {
      msg.textContent = err.message; msg.className = 'form-msg err';
      if (step === 'verify' && /请先请求验证码|验证码已过期/.test(err.message || '')) {
        btn.dataset.step = 'request'; btn.textContent = '发送验证码';
        codeEl.required = false; codeEl.value = '';
        document.getElementById('code-row').hidden = true;
        emailEl.readOnly = false; delete form.dataset.email;
      }
    } finally {
      btn.disabled = false;
    }
  });

  // OAuth：回跳到本页以便处理 ?token=（同时保�?ext 标记�?  document.querySelectorAll('.oauth-row button').forEach((b) => {
    b.addEventListener('click', () => {
      const back = new URL(location.origin + '/signup.html');
      if (fromExt) back.searchParams.set('ext', '1');
      if (redirect !== '/') back.searchParams.set('redirect', redirect);
      const state = Math.random().toString(36).slice(2);
      location.href = `${AUTH_BASE}/auth/${b.dataset.provider}?state=${state}&redirect=${encodeURIComponent(back.toString())}`;
    });
  });
})();
</script>
