name = "ailatest-journal-api"
main = "src/index.js"
compatibility_date = "2024-11-01"
account_id = "e7dbf2ec3ab60aa5557cc2364a7a2f26"

routes = [
  { pattern = "api.ailatest.org", custom_domain = true },
  # Same-origin API path on the main site: immune to proxy/DNS rules that
  # break the api.* subdomain in some users' browsers, and needs no CORS.
  { pattern = "journal.ailatest.org/api/*", zone_id = "435525fb783ba7bf4c686a9734e26124" }
]

[triggers]
crons = [
  "*/15 * * * *",
  # 00:12 Asia/Shanghai: finalize yesterday after GA/edge data has had time to settle.
  "12 16 * * *"
]

[vars]
GITHUB_CLIENT_ID = "Ov23liKY2We6M23yTMJV"
GOOGLE_CLIENT_ID = "393406357932-4sqvlnbm296o5pj68o60i8o8k2ujgfov.apps.googleusercontent.com"
SITE_URL         = "https://journal.ailatest.org"
MAIL_FROM        = "noreply@ailatest.org"   # must be a Resend-verified sender
CF_ZONE_ID       = "435525fb783ba7bf4c686a9734e26124"  # journal.ailatest.org zone (Cloudflare Analytics)
GA4_PROPERTY_ID  = "537014253"                          # Google Analytics 4 property

[[d1_databases]]
binding = "DB"
database_name = "ailatest-journal"
database_id = "861dd053-c23a-4363-b62b-2559c06ec3fd"

# Secrets to configure:
#   wrangler secret put GITHUB_CLIENT_SECRET
#   wrangler secret put GOOGLE_CLIENT_SECRET
#   wrangler secret put JWT_SECRET
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put DEEPSEEK_API_KEY
#   wrangler secret put OPENALEX_API_KEY
#   wrangler secret put CODE_PEPPER
#   wrangler secret put CF_ANALYTICS_TOKEN   # Cloudflare API token, Analytics:Read (dashboard)
#   wrangler secret put GA4_SA_KEY           # GA4 service-account JSON (dashboard)
