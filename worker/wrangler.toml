name = "ailatest-journal-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Custom domain or worker subdomain
# routes = [{ pattern = "api.ailatest.org/*", zone_name = "ailatest.org" }]

[vars]
GITHUB_CLIENT_ID = ""          # set via: wrangler secret put OR fill here (public)
SITE_URL = "https://journal.ailatest.org"

# D1 database — create with: wrangler d1 create ailatest-journal
# Then paste database_id below.
[[d1_databases]]
binding = "DB"
database_name = "ailatest-journal"
database_id = "REPLACE_WITH_D1_ID"

# Secrets (set with `wrangler secret put`):
#   GITHUB_CLIENT_SECRET
#   JWT_SECRET    (any long random string, e.g. openssl rand -base64 48)
