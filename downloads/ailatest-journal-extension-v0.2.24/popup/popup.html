<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AILatest Journal</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <header>
      <img src="../assets/icon-48.png" alt="" width="32" height="32">
      <div>
        <h1>AILatest Journal</h1>
        <p data-i18n="popup.subtitle">期刊评级徽章</p>
      </div>
    </header>

    <!-- 账号 -->
    <section class="account" aria-label="账号" data-i18n-aria="popup.account">
      <div id="logged-in" hidden>
        <div class="user-box">✅ <span data-i18n="popup.loggedIn">已登录：</span><b id="user-label"></b>
          <button class="link-btn" id="logout-btn" type="button" data-i18n="popup.logout">退出</button>
        </div>
      </div>
      <div id="logged-out" hidden>
        <p class="hint" id="trial-banner" data-i18n="popup.trial">未登录也可用：每日 40 次查询；登录后同步账号权益</p>
        <form id="login-form">
          <input type="email" id="email" placeholder="邮箱（新邮箱即注册）" data-i18n-placeholder="popup.email" autocomplete="email" required>
          <input type="text" id="code" placeholder="6 位验证码" data-i18n-placeholder="popup.code" inputmode="numeric" maxlength="6" hidden>
          <button class="btn" type="submit" id="submit-btn" data-step="request" data-i18n="popup.login">注册 / 登录</button>
          <p class="msg" id="login-msg"></p>
        </form>
        <button class="btn ghost" id="oauth-btn" type="button" data-i18n="popup.oauth">用 GitHub / Google 登录</button>
      </div>
    </section>

    <!-- 配额提示 -->
    <p class="quota-hint" id="quota-hint" hidden></p>

    <!-- 徽章设置 -->
    <section class="settings" aria-label="徽章设置" data-i18n-aria="popup.settings">
      <div class="set-title" data-i18n="popup.displayTheme">显示主题</div>
      <label class="select-row"><span data-i18n="popup.language">语言</span>
        <select id="lang-select">
          <option value="auto" data-i18n="popup.langAuto">自动（跟随浏览器）</option>
          <option value="zh-CN">中文</option>
          <option value="en">English</option>
        </select>
      </label>
      <div class="theme-row" id="theme-row">
        <label><input type="radio" name="theme" value="site" checked> <span data-i18n="popup.themeSite">网站默认</span></label>
        <label><input type="radio" name="theme" value="light"> <span data-i18n="popup.themeLight">淡雅</span></label>
        <label><input type="radio" name="theme" value="dark"> <span data-i18n="popup.themeDark">深色</span></label>
      </div>

      <div class="set-title" data-i18n="popup.whichBadges">显示哪些徽章</div>
      <div class="toggles" id="toggles">
        <div class="cat-label" data-i18n="popup.categoryIndex">收录</div>
        <label><input type="checkbox" data-setting="showIndex"> <span data-i18n="popup.indexIntl">国际索引（SCIE / SSCI / EI / Scopus…）</span></label>
        <label><input type="checkbox" data-setting="showCnIndex"> <span data-i18n="popup.indexCn">国内目录（北大核心 / CSSCI / CSCD）</span></label>

        <div class="cat-label" data-i18n="popup.categoryRating">分级</div>
        <label><input type="checkbox" data-setting="showCas"> <span data-i18n="popup.cas">中科院分区 / 新锐</span></label>
        <label><input type="checkbox" data-setting="showJcr"> <span data-i18n="popup.jcr">JCR 分区</span></label>
        <label><input type="checkbox" data-setting="showIf"> <span data-i18n="popup.if">影响因子 IF</span></label>
        <label><input type="checkbox" data-setting="showCcf"> <span data-i18n="popup.ccf">CCF 推荐</span></label>
        <label><input type="checkbox" data-setting="showBusiness"> <span data-i18n="popup.business">商科分级（ABDC / ABS / FMS / VHB / CNRS）</span></label>
        <label><input type="checkbox" data-setting="showCnTier"> <span data-i18n="popup.cnTier">国内分级（科协 / CCF-T / SCD / AMI / 浙大 / NSFC）</span></label>

        <div class="cat-label" data-i18n="popup.categoryOpen">免费开放</div>
        <label><input type="checkbox" data-setting="showFree"> <span data-i18n="popup.free">免费发表 / DOAJ 免 APC</span></label>

        <div class="cat-label" data-i18n="popup.categoryWarning">预警</div>
        <label><input type="checkbox" data-setting="showWarnings"> <span data-i18n="popup.warnings">预警 / 撤稿 / 停收</span></label>
      </div>

      <div class="set-title"><span data-i18n="popup.customColors">自定义颜色</span> <span class="muted" data-i18n="popup.colorsHint">（留默认则跟随主题）</span></div>
      <div class="colors" id="colors">
        <label><span data-i18n="popup.colorZone">分区</span> <input type="color" data-color="cas"></label>
        <label>JCR <input type="color" data-color="jcr"></label>
        <label>IF <input type="color" data-color="if"></label>
        <label><span data-i18n="popup.colorIndex">索引</span> <input type="color" data-color="idx"></label>
      </div>

      <button class="link-btn" id="reset-settings" type="button" data-i18n="popup.reset">恢复默认（主题 + 颜色）</button>
    </section>

    <footer>
      <a href="https://journal.ailatest.org/" target="_blank" rel="noopener noreferrer" data-i18n="popup.openSite">打开 AILatest Journal</a>
    </footer>
  </main>
  <script src="../src/norm.js"></script>
  <script src="../src/i18n.js"></script>
  <script src="../src/lookup.js"></script>
  <script src="popup.js"></script>
</body>
</html>
