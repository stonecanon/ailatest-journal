<!DOCTYPE html>
<html><body>
<h3>OpenAlex API Test</h3>
<div id="result">Testing...</div>
<script>
(async () => {
  const url = 'https://api.openalex.org/works?search=occupancy+detection+building&per_page=5&sort=relevance_score:desc&select=id,title,primary_location,relevance_score';
  try {
    const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
    const d = await r.json();
    const results = d.results || [];
    document.getElementById('result').innerHTML = 
      '✅ API OK! 返回 ' + results.length + ' 篇论文<br><br>' +
      results.map(w => {
        const src = w.primary_location?.source?.display_name || '?';
        return '• ' + src + ' — ' + (w.title || '').slice(0,60);
      }).join('<br>');
  } catch(e) {
    document.getElementById('result').innerHTML = '❌ 失败: ' + (e.message || e);
  }
})();
</script>
</body></html>
